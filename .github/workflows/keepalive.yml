# Pings the hosted backend every 10 minutes so Render's free plan doesn't put it
# to sleep (a sleeping service takes about a minute to wake on the next visit).
name: Keep the live server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 https://prooflog.onrender.com/health
