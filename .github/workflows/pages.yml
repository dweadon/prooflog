# Publishes the online demo of the dashboard to GitHub Pages.
# There's no backend on Pages, so it's built in demo mode (VITE_DEMO=1) and
# shows a real report ProofLog produced from the public Loghub OpenSSH log.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Bundle the real demo report and the example log it was made from
        run: |
          mkdir -p public
          cp demo-backup/OpenSSH_2k_report.json public/demo-report.json
          cp ../examples/OpenSSH_2k.log public/OpenSSH_2k.log
      - name: Build in demo mode
        run: npx vite build --base=/prooflog/
        env:
          VITE_DEMO: "1"
          # Address of the hosted AI backend (repo variable PROOFLOG_API_URL); empty = no AI on the demo.
          VITE_LIVE_API_URL: ${{ vars.PROOFLOG_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
